<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F12">
<meta name="color-scheme" content="dark">
<title>Tap Logger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
--bg: #0E0F12; --card: #17191E; --line: #2A2D35; --raise: #23262D; --sel: #2A2D35;
--text: #F2F3F5; --muted: #9AA0AA; --faint: #5B616B; --accent: #00E0FF; --accent-ink: #0E0F12; --tick-bg: #083344;
--bad: #F87171;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 16px; }
body { padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 40px); max-width: 520px; margin: 0 auto; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top { display: flex; align-items: center; justify-content: space-between; }
.round { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--card); display: flex; align-items: center; justify-content: center; padding: 0; }
.round svg { width: 18px; height: 18px; }
.date { text-align: center; }
.date small { display: block; font-size: 13px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.date strong { font-size: 22px; font-weight: 700; }
.progress { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.progress .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.progress .row b { color: var(--text); font-weight: 600; }
.bar { height: 8px; border-radius: 4px; background: var(--raise); overflow: hidden; }
.bar i { display: block; height: 8px; border-radius: 4px; background: var(--accent); transition: width .3s; }
.tabs { margin: 16px 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px; position: sticky; top: calc(env(safe-area-inset-top) + 6px); z-index: 5; box-shadow: 0 8px 16px var(--bg); }
.tabs button { height: 50px; padding: 0; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 500; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.tabs button span { font-size: 11px; }
.tabs button.on { background: var(--sel); color: var(--text); font-weight: 600; }
.tabs button.on span, .tabs button span.done { color: var(--accent); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.card h2 { margin: 0; font-size: 17px; font-weight: 600; }
.card .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.big { font-size: 28px; font-weight: 700; color: var(--accent); }
.big.empty { color: var(--faint); }
.logged { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 8px 12px 16px; display: flex; align-items: center; gap: 12px; }
.tick { width: 36px; height: 36px; flex: none; border-radius: 18px; background: var(--tick-bg); color: var(--accent); display: flex; align-items: center; justify-content: center; }
.tick svg { width: 18px; height: 18px; }
.logged .txt { flex-grow: 1; min-width: 0; }
.logged .txt b { display: block; font-size: 15px; font-weight: 600; }
.logged .txt span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ghost { height: 44px; padding: 0 14px; border: 0; background: transparent; color: var(--muted); font-size: 14px; font-weight: 500; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.tile .lab { font-size: 13px; color: var(--muted); }
.tile .val { font-size: 28px; font-weight: 700; }
.tile .val small { font-size: 14px; color: var(--muted); font-weight: 500; }
.tile .ok { font-size: 12px; color: var(--accent); }
.tile button.val { background: none; border: 0; padding: 0; text-align: left; color: var(--text); }
label.f { display: flex; flex-direction: column; gap: 6px; }
label.f > span { font-size: 13px; color: var(--muted); }
textarea, input.in { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 12px; font-size: 16px; }
textarea { min-height: 76px; resize: vertical; }
input.in { height: 48px; }
input.num { font-size: 20px; font-weight: 600; }
input[type=time].in { font-size: 20px; font-weight: 600; color-scheme: dark; }
textarea::placeholder, input::placeholder { color: var(--faint); }
.cta { height: 52px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-size: 16px; font-weight: 700; width: 100%; }
.cta.alt { background: var(--raise); color: var(--text); border: 1px solid var(--line); font-weight: 600; }
.cta.sm { height: 48px; width: auto; padding: 0 18px; flex: none; }
.inline { display: flex; gap: 8px; align-items: flex-end; }
.inline > label { flex-grow: 1; }
.slider { display: flex; flex-direction: column; gap: 8px; }
.slider .ctl { display: flex; align-items: center; gap: 10px; }
.nudge { width: 44px; height: 44px; flex: none; border-radius: 22px; border: 1px solid var(--line); background: var(--raise); font-size: 22px; line-height: 1; padding: 0; }
.slider .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 0 54px; }
input[type=range] { -webkit-appearance: none; appearance: none; flex-grow: 1; height: 44px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(to right, var(--accent) 0 var(--fill-a, 0%), var(--raise) var(--fill-a, 0%) 100%); }
input[type=range].mid::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--raise) 0 var(--lo, 50%), var(--accent) var(--lo, 50%) var(--hi, 50%), var(--raise) var(--hi, 50%) 100%); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 15px; background: var(--text); margin-top: -11px; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
input[type=range].untouched::-webkit-slider-thumb { background: var(--faint); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--raise); font-size: 14px; font-weight: 500; }
.chips button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
details { border: 1px solid var(--line); border-radius: 14px; background: var(--bg); padding: 0 14px; }
details[open] { padding-bottom: 14px; }
summary { list-style: none; min-height: 48px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 15px; cursor: pointer; }
summary::-webkit-details-marker { display: none; }
summary svg { width: 18px; height: 18px; transition: transform .2s; }
details[open] summary svg { transform: rotate(180deg); }
summary small { color: var(--muted); font-weight: 500; font-size: 13px; margin-left: auto; margin-right: 8px; }
.in-details { display: flex; flex-direction: column; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid3 input.in { text-align: center; font-size: 18px; font-weight: 600; padding: 0 4px; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: var(--card); border-radius: 10px; padding: 3px; }
.seg button { height: 40px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 500; }
.seg button.on { background: var(--sel); color: var(--text); font-weight: 600; }
.lab12 { font-size: 12px; color: var(--muted); }
.checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.checks button { height: 52px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 12px; padding: 0 12px; text-align: left; }
.box { width: 26px; height: 26px; flex: none; border-radius: 8px; border: 2px solid #3A3F49; display: flex; align-items: center; justify-content: center; }
.checks button.on .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.box svg { width: 16px; height: 16px; display: none; }
.checks button.on .box svg { display: block; }
.saved { font-size: 13px; color: var(--muted); white-space: pre-line; background: var(--bg); border-radius: 10px; padding: 10px 12px; }
.note { font-size: 13px; color: var(--muted); padding: 0 4px; }
.foot { margin-top: 28px; text-align: center; font-size: 12px; color: var(--faint); }
.foot button { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 12px; padding: 8px; }
#toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 16px); max-width: 488px; margin: 0 auto; padding: 14px 16px; border-radius: 14px; font-weight: 600; text-align: center; transform: translateY(140%); transition: transform .25s; z-index: 30; }
#toast.show { transform: none; }
#toast.ok { background: var(--text); color: var(--bg); box-shadow: 0 8px 24px rgba(0,0,0,.45); }
#toast.act { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 6px 6px 16px; text-align: left; }
#toast button { height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; }
#toast.err { background: #7F1D1D; color: #FEE2E2; }
#sheet { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
#sheet.show { display: flex; }
#sheet .panel { background: var(--card); width: 100%; max-width: 520px; border-radius: 22px 22px 0 0; padding: 12px 16px calc(env(safe-area-inset-bottom) + 20px); max-height: 85vh; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; }
.conf { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.conf b { font-size: 15px; }
.conf .now { color: #FCA5A5; font-size: 14px; white-space: pre-wrap; }
.conf .new { color: var(--accent); font-size: 14px; white-space: pre-wrap; }
.setup { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.setup h1 { margin: 0; font-size: 28px; }
.setup p { margin: 0; color: var(--muted); line-height: 1.5; }
.loading { color: var(--muted); text-align: center; padding: 40px 0; }
.stale { opacity: .65; transition: opacity .2s; }
.grid11 { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--bg); }
.grid11 button { height: 46px; padding: 0; border: 0; border-right: 1px solid var(--line); border-radius: 0; background: transparent; font-size: 15px; font-weight: 600; }
.grid11 button:last-child { border-right: 0; }
.grid11 button.on { background: var(--accent); color: var(--accent-ink); }
.grid11 button:active { transform: none; background: var(--raise); }
.grid11 button.on:active { background: var(--accent); }
.grid11 button.half { font-size: 13px; letter-spacing: -0.5px; }
.slbl { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); margin-bottom: -6px; }
.slbl b { color: var(--text); font-size: 17px; font-weight: 700; }
.slbl b.empty { color: var(--faint); }
.sub { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }
.srow { display: flex; flex-direction: column; gap: 6px; }
.srow .lbl { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); }
.srow .lbl b { color: var(--text); font-size: 15px; font-weight: 600; }
.srow .lbl b.empty { color: var(--faint); }
.upd { width: 100%; height: 48px; margin-bottom: 12px; border: 1px solid var(--accent); border-radius: 14px; background: var(--tick-bg); color: var(--accent); font-size: 15px; font-weight: 600; }
.pending { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 6px 6px 14px; border: 1px dashed var(--line); border-radius: 12px; font-size: 13px; color: var(--muted); }
.sec { margin: 10px 2px -2px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.tl { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 4px 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tl .rail, .tl .fill { position: absolute; left: 12.5%; top: 27px; height: 2px; background: var(--line); }
.tl .rail { right: 12.5%; }
.tl .fill { background: var(--accent); transition: width .3s; }
.tl button { position: relative; background: none; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
.tl .dot { width: 28px; height: 28px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); display: flex; align-items: center; justify-content: center; }
.tl .dot svg { width: 16px; height: 16px; }
.tl .done .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tl .now .dot { border-color: var(--accent); }
.tl .now .dot::after { content: ''; width: 10px; height: 10px; border-radius: 5px; background: var(--accent); }
.tl .missed .dot { border-style: dashed; border-color: var(--muted); }
.tl b { font-size: 13px; font-weight: 600; }
.tl .later b, .tl .missed b { color: var(--muted); }
.tl small { font-size: 11px; color: var(--muted); white-space: nowrap; }
.tl .missed small { color: #FBBF24; }
.autobar { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.autobar .bar { flex-grow: 1; height: 4px; }
.autobar .bar i { height: 4px; }
.autobar .ghost { height: 36px; padding: 0 4px; color: var(--muted); text-decoration: underline; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { padding: 7px 10px; border-radius: 16px; background: var(--raise); border: 1px solid var(--line); font-size: 13px; }
.two { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
.caught { align-items: center; text-align: center; padding: 28px 16px; }
.caught .tick { width: 52px; height: 52px; border-radius: 26px; }
.caught .tick svg { width: 26px; height: 26px; }
.sk { height: 130px; border-radius: 18px; background: linear-gradient(90deg, var(--card) 0%, var(--raise) 50%, var(--card) 100%); background-size: 200% 100%; animation: sh 1.3s linear infinite; }
.sk.t { height: 58px; border-radius: 14px; margin: 16px 0; }
@keyframes sh { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@keyframes pop { from { transform: scale(.96); opacity: .3; } to { transform: none; opacity: 1; } }
.logged.pop { animation: pop .35s ease-out; }
button:not(:disabled):active { transform: scale(.97); }
button { transition: transform .08s, background-color .15s; }
.big, .srow .lbl b, .slbl b, .tile .val, .progress b, .tl small { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .sk, .logged.pop { animation: none; } button:active { transform: none; } }
.pending button { height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--raise); font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="panel" id="sheet-panel"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
// ---------------------------------------------------------------- setup
const LS_CFG = 'tl_cfg', LS_CACHE = 'tl_cache', LS_Q = 'tl_queue';
const APP_VERSION = '6';
const ICON = {
left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
tick: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>',
chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>'
};
function readCfg() { try { return JSON.parse(localStorage.getItem(LS_CFG) || 'null'); } catch (e) { return null; } }
function takeSetupFromLink() {
const m = location.hash.match(/setup=([A-Za-z0-9_-]+)/);
if (!m) return;
try {
const json = atob(m[1].replace(/-/g, '+').replace(/_/g, '/'));
const c = JSON.parse(json);
if (c.url && c.key) localStorage.setItem(LS_CFG, JSON.stringify({ url: c.url, key: c.key }));
} catch (e) {}
history.replaceState(null, '', location.pathname + location.search);
}
// ---------------------------------------------------------------- state
const S = {
cfg: null, offset: 0, data: null, loading: false, stale: false,
tab: null, open: {}, busy: {}, d: {}  // d = drafts the user has typed but not saved
};
const TABS = ['Now', 'Morning', 'Day', 'Evening', 'More'];
const SUPPS = [['multivit', 'Multivitamin'], ['vitD', 'Vitamin D3+K2'], ['omega', 'Omega-3'], ['electro', 'Electrolytes']];
const SCORES = {
am: [['amFog', 'Brain fog', '0 = none'], ['amIrr', 'Irritability / agitation', '0 = none'], ['amEnergy', 'Energy', '10 = best']],
aft: [['aftFog', 'Brain fog', '0 = none'], ['aftIrr', 'Irritability / agitation', '0 = none'], ['aftEnergy', 'Energy', '10 = best']],
eve: [['eveFog', 'Brain fog', '0 = none'], ['eveIrr', 'Irritability / agitation', '0 = none'], ['eveEnergy', 'Energy', '10 = best']]
};
const filled = x => x !== '' && x != null;
const moodDone = (v, p) => filled(v[p + 'Mood']) && SCORES[p].every(([k]) => filled(v[k]));
const numOnly = x => (/^\s*\d+(\.\d+)?\s*$/.test(String(x == null ? '' : x)) ? String(x).trim() : '');
const TEXT_KEYS = ['sleepNotes', 'bowel', 'exNotes', 'moodNotes', 'hunger', 'extraKet', 'glucose', 'exercise', 'gymDur', 'gymInt'];
const DAILY = [['depressive', 'Depressive symptoms', '0 = none'], ['manic', 'Manic symptoms', '0 = none'], ['dFog', 'Brain fog', '0 = none'], ['dIrr', 'Irritability / agitation', '0 = none'], ['dEnergy', 'Energy', '10 = best']];
const DAILY_MOOD = [['dMood', 'Overall mood'], ['dHigh', 'Highest mood'], ['dLow', 'Lowest mood']];
const GYM = [['gymFocus', 'Focus', '10 = best'], ['gymEnergy', 'Energy', '10 = best'], ['gymStrength', 'Strength', '10 = best']];
const dailyDone = v => DAILY.concat(DAILY_MOOD).every(([k]) => filled(v[k]));
const ITEMS = [
{ id: 'sleep', tab: 'Morning', done: v => !!v.sleepQ },
{ id: 'weight', tab: 'Morning', done: v => !!v.weight },
{ id: 'ketones', tab: 'Morning', done: v => !!v.ketonesAM },
{ id: 'amMood', tab: 'Morning', done: v => moodDone(v, 'am') },
{ id: 'bowel', tab: 'Day', done: v => !!v.bowel },
{ id: 'firstBite', tab: 'Day', done: v => !!v.firstBite },
{ id: 'supps', tab: 'Day', done: v => ['multivit', 'vitD', 'omega', 'electro', 'creatine', 'lcarn', 'mag'].some(k => !!v[k]) },
{ id: 'exercise', tab: 'Day', done: v => !!v.exercise },
{ id: 'aftMood', tab: 'Day', done: v => moodDone(v, 'aft') },
{ id: 'lastBite', tab: 'Evening', done: v => !!v.lastBite },
{ id: 'eveMood', tab: 'Evening', done: v => moodDone(v, 'eve') },
{ id: 'hunger', tab: 'Evening', done: v => ('hungerScore' in v ? filled(v.hungerScore) : !!v.hunger) },
{ id: 'dailyMood', tab: 'Evening', done: dailyDone }
];
function defaultTab() { return 'Now'; }
// which mood block is it now (before 3am still counts as yesterday's evening)
const blockNow = () => { const h = new Date().getHours(); return h < 3 ? 'eve' : h < 12 ? 'am' : h < 18 ? 'aft' : 'eve'; };
const MOOD_META = { am: ['AM mood', 'Waking to 12 PM', 'Morning', 'Waking–12'], aft: ['Afternoon mood', '12 PM to 6 PM', 'Day', '12–6 PM'], eve: ['Evening mood', '6 PM until bed', 'Evening', '6 PM–bed'] };
function expectedLabel(offset) {
const now = new Date();
const d = new Date(now.getTime() + ((now.getHours() < 3 ? -1 : 0) + offset) * 864e5);
const p = {};
new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }).formatToParts(d).forEach(x => p[x.type] = x.value);
return p.weekday + ' ' + p.day + ' ' + p.month;
}
// ---------------------------------------------------------------- helpers
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const nowHHMM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const signed = n => (n > 0 ? '+' : '') + n;

// ---------------------------------------------------------------- loading

// ---------------------------------------------------------------- saving
async function send(cardId, items, label, quiet) {
if (S.busy[cardId]) return { status: 'busy' };
let out = { status: 'error' };
label = label || (S.data ? S.data.label : expectedLabel(S.offset));
S.busy[cardId] = true; render();
try {
const r = await api('save', { items, label });
if (r.ok) { clearCard(cardId, items); if (!quiet) toast('Saved', true); load(true); out = { status: 'ok' }; }
else { openConflicts(cardId, items, r.conflicts, label); out = { status: 'conflict' }; }
} catch (e) {
if (e.net) {
const id = Date.now() + '-' + Math.random().toString(36).slice(2);
const q = getQ(); q.push({ id, cardId, items, label }); setQ(q);
clearCard(cardId, items);
if (!quiet) toast('No signal. Kept on the phone, it’ll send when you’re back online', true);
out = { status: 'queued', id };
} else toast(e.message, false);
}
S.busy[cardId] = false; render();
return out;
}
function clearCard(cardId, items) {

(CLEAR[cardId] || []).forEach(k => delete S.d[k]);

let flushing = false;
async function flush(manual) {

try {
const r = await api('save', { items: job.items, label: job.label });
setQ(getQ().filter(x => x.id !== job.id));
if (r.ok) sent++;
else { openConflicts(job.cardId, job.items, r.conflicts, job.label); break; }
} catch (e) {
if (e.net) { waiting = true; break; }
setQ(getQ().filter(x => x.id !== job.id));
toast('A waiting save failed: ' + e.message, false);
}
}
flushing = false;
if (sent) toast(sent === 1 ? 'Waiting save sent' : sent + ' waiting saves sent', true);
else if (waiting && manual) toast('Still no signal', false);
load(true);
}

'<button class="cta sm" data-save="' + key + '"' + (S.busy[key] ? ' disabled' : '') + '>' + (S.busy[key] ? '…' : 'Log') + '</button></div>' +
(S.open[key] ? '<button class="ghost" data-close="' + key + '" style="align-self:center">Cancel</button>' : '') + '</div>';
}
function suppCard(v) {
const isDone = ITEMS.find(i => i.id === 'supps').done(v);
if (!isOpen('supps', isDone)) {
const parts = SUPPS.filter(([k]) => /^y/i.test(v[k] || '')).map(([, n]) => n);
if (v.lcarn) parts.push('L-carnitine ' + v.lcarn + 'mg');
if (v.mag) parts.push('Magnesium ×' + v.mag);
if (v.creatine) parts.push(numOnly(v.creatine) ? 'Creatine ' + v.creatine + 'g' : 'Creatine');
return loggedRow('supps', 'Supplements', parts.join(', '));
}
const prev = (S.data && S.data.prev) || {};
const yTicks = SUPPS.filter(([k]) => /^y/i.test(prev[k] || '')).map(([, n]) => n);
const yAmts = [['lcarn', 'L-carnitine ', ' mg'], ['mag', 'Magnesium ×', ''], ['creatine', 'Creatine ', ' g']].filter(([k]) => numOnly(prev[k]) !== '').map(([k, a, b]) => a + numOnly(prev[k]) + b);
if (!isDone && !S.open.suppEdit && (yTicks.length || yAmts.length)) {
return '<div class="card"><div class="head"><h2>Supplements</h2><span class="lab12">Yesterday</span></div>' +
'<div class="tags">' + yTicks.concat(yAmts).map(x => '<span>' + esc(x) + '</span>').join('') + '</div>' +
'<div class="two"><button class="cta" data-save="suppsSame"' + (S.busy.suppsSame ? ' disabled' : '') + '>' + (S.busy.suppsSame ? 'Saving…' : 'Same as yesterday') + '</button><button class="cta alt" data-suppedit="1">Change</button></div></div>';
}
const sel = draft('supSel', SUPPS.filter(([k]) => /^y/i.test(v[k] || '')).map(([k]) => k));
const lc = draft('lcarn', v.lcarn || numOnly(prev.lcarn)), mg = draft('mag', v.mag || numOnly(prev.mag)), cr = draft('creatine', v.creatine || numOnly(prev.creatine));
return '<div class="card" style="padding:4px 16px 16px"><details' + (S.open.suppsBody !== false ? ' open' : '') + ' id="supp-d" style="border:0;background:none;padding:0">' +
'<summary><span>Supplements</span><small>' + sel.length + ' ticked</small>' + ICON.chev + '</summary><div class="in-details">' +
'<div class="checks">' + SUPPS.map(([k, n]) => '<button data-supp="' + k + '" class="' + (sel.indexOf(k) >= 0 ? 'on' : '') + '" aria-pressed="' + (sel.indexOf(k) >= 0) + '"><span class="box">' + ICON.tick + '</span>' + n + '</button>').join('') + '</div>' +
'<div class="grid3"><label class="f"><span class="lab12">L-carnitine (mg)</span><input class="in num" id="i_lcarn" data-d="lcarn" inputmode="numeric" value="' + esc(lc) + '"></label>' +
'<label class="f"><span class="lab12">Magnesium (caps)</span><input class="in num" id="i_mag" data-d="mag" inputmode="numeric" value="' + esc(mg) + '"></label>' +
'<label class="f"><span class="lab12">Creatine (g)</span><input class="in num" id="i_creatine" data-d="creatine" inputmode="decimal" value="' + esc(cr) + '"></label></div>' +
'<div class="lab12">Amounts start at yesterday’s. Unticked ones stay blank.</div>' + saveBtn('supps', 'Save supplements') + '</div></details></div>';
}
function exerciseCard(v) {
const gymBits = GYM.filter(([k]) => filled(v[k])).map(([k, l]) => l.toLowerCase() + ' ' + v[k]).concat(v.gymDur ? ['duration ' + v.gymDur] : [], v.gymInt ? ['intensity ' + v.gymInt] : []);
if (!isOpen('exercise', !!v.exercise)) return loggedRow('exercise', 'Exercise', v.exercise + (gymBits.length ? ' · ' + gymBits.join(' · ') : '') + (v.exNotes ? ' · notes saved' : ''));
const opts = (S.data && S.data.exOptions) || [];
const sel = draft('exSel', []);
const seg = (key, labels) => '<div class="seg" data-segkey="' + key + '">' + labels.map(l => '<button data-segv="' + l + '" class="' + (draft(key, '') === l ? 'on' : '') + '">' + l + '</button>').join('') + '</div>';
const pick = (title, sheetKey, segKey, labels, noteKey, ph) => '<div class="f" style="display:flex;flex-direction:column;gap:6px"><span class="lab12">' + title + (v[sheetKey] ? ' · saved: ' + esc(v[sheetKey]) : '') + '</span>' + seg(segKey, labels) +
'<input class="in" id="i_' + noteKey + '" data-d="' + noteKey + '" placeholder="' + ph + '" value="' + esc(draft(noteKey, '')) + '"></div>';
const gymOn = sel.some(o => /gym/i.test(o)) || gymBits.length > 0;
const open = S.open.gym === undefined ? gymOn : S.open.gym;
const shown = GYM.map(([k]) => (k in S.d ? S.d[k] : v[k])).filter(filled);
return '<div class="card"><h2>Exercise</h2>' +
(v.exercise ? '<div class="saved">Saved: ' + esc(v.exercise) + '</div>' : '') +
'<div class="chips">' + opts.map(o => '<button data-chip="' + esc(o) + '" class="' + (sel.indexOf(o) >= 0 ? 'on' : '') + '" aria-pressed="' + (sel.indexOf(o) >= 0) + '">' + esc(o) + '</button>').join('') + '</div>' +
'<details id="gym-d"' + (open ? ' open' : '') + '><summary><span>Gym scores' + (shown.length ? ' · ' + shown.join(' / ') : '') + '</span>' + ICON.chev + '</summary><div class="in-details">' +
GYM.map(([k, l, hint]) => scoreRow(k, l, hint, v[k])).join('') +
pick('Duration', 'gymDur', 'g_dur', ['Too short', 'Good', 'Too long'], 'g_durNote', 'Duration note, e.g. 1h50') +
pick('Intensity', 'gymInt', 'g_int', ['Too easy', 'Good', 'Too hard'], 'g_intNote', 'Intensity note (optional)') +
'</div></details>' +
(v.exNotes ? '<div class="saved">Notes saved: ' + esc(v.exNotes) + '</div>' : '') +
textArea('exNotes', 'Exercise notes', 'How today’s exercise went', 96) + saveBtn('exercise', 'Save exercise') + '</div>';
}
function hungerCard(v) {
const hasScore = 'hungerScore' in v;
const isDone = ITEMS.find(i => i.id === 'hunger').done(v);
if (!isOpen('hunger', isDone)) return loggedRow('hunger', 'Hunger', [filled(v.hungerScore) ? v.hungerScore + ' / 10' : '', v.hunger].filter(Boolean).join(' · '));
return '<div class="card"><h2>Hunger</h2>' +
(hasScore ? scoreRow('hungerScore', 'How hungry today', '10 = very hungry', v.hungerScore) : '') +
(v.hunger ? '<div class="saved">Saved: ' + esc(v.hunger) + '</div>' : '') +
textArea('hunger', hasScore ? 'Note' : 'How hungry you were today', 'e.g. hungry before lunch, none after dinner') + saveBtn('hunger', 'Save hunger', true) + '</div>';
}
function dailyMoodCard(v) {
const isDone = dailyDone(v);
if (!isOpen('dailyMood', isDone)) {
const short = { depressive: 'depressive', manic: 'manic', dFog: 'fog', dIrr: 'irritability', dEnergy: 'energy' };
return loggedRow('dailyMood', 'Daily mood', signed(Number(v.dMood)) + ' (' + signed(Number(v.dLow)) + ' to ' + signed(Number(v.dHigh)) + ')' + DAILY.map(([k]) => ' · ' + short[k] + ' ' + v[k]).join('') + (v.moodNotes ? ' · note saved' : ''));
}
const moodSlider = ([k, l]) => {
const t = k in S.d, cur = filled(v[k]) ? signed(Number(v[k])) : '';
return '<div class="slbl"><span>' + l + '</span><b data-for="' + k + '" class="' + (t || cur ? '' : 'empty') + '">' + (t ? signed(Number(S.d[k])) : (cur || '—')) + '</b></div>' + sliderBlock(k, -5, 5, v[k]);
};
return '<div class="card"><h2>Daily mood</h2><div class="note" style="padding:0">The whole day, end of day.</div>' +
DAILY.map(([k, l, hint]) => scoreRow(k, l, hint, v[k])).join('') +
'<div class="sub">Mood −5 to +5</div>' + DAILY_MOOD.map(moodSlider).join('') +
(v.moodNotes ? '<div class="saved">Saved: ' + esc(v.moodNotes) + '</div>' : '') +
textArea('moodNotes', 'Overall mood notes', 'How the day went overall', 96) + saveBtn('dailyMood', 'Save daily mood') + '</div>';
}
function moreCard(key, title, label, ph, mode, v) {
return '<div class="card"><h2>' + title + '</h2>' + (v[key] ? '<div class="saved">Saved today:\n' + esc(v[key]) + '</div>' : '') +
textArea(key, label, ph) + '<button class="cta alt" data-save="' + key + '"' + (S.busy[key] ? ' disabled' : '') + '>' + (S.busy[key] ? 'Saving…' : (mode === 'append' ? 'Add' : 'Save')) + '</button></div>';
}
// ---------------------------------------------------------------- collecting a card's items
function collect(id) {
const v = V(), d = S.d, items = [];
const num = (k, lo, hi, label) => {
const raw = String(d[k] == null ? '' : d[k]).replace(',', '.').trim();
if (!raw) return null;
const n = Number(raw);
if (isNaN(n) || n < lo || n > hi) throw new Error(label);
return n;
};
const text = k => String(d[k] || '').trim();
switch (id) {
case 'sleep':
if ('sleepQ' in d) items.push({ key: 'sleepQ', value: Number(d.sleepQ), mode: 'new' });
if (text('sleepNotes')) items.push({ key: 'sleepNotes', value: text('sleepNotes'), mode: 'new' });
if (!items.length) throw new Error('Move the slider or write a note');
break;
case 'ketones': { const n = num('ketonesAM', 0, 10, 'Ketones should be 0 to 10'); if (n == null) throw new Error('Enter your reading'); items.push({ key: 'ketonesAM', value: n, mode: 'new' }); break; }
case 'dailyMood': {
DAILY.concat(DAILY_MOOD).forEach(([k]) => { if (k in d && d[k] !== '') items.push({ key: k, value: Number(d[k]), mode: 'new' }); });
const val = k => (k in d && d[k] !== '' ? Number(d[k]) : (filled(v[k]) ? Number(v[k]) : null));
const lo = val('dLow'), hi = val('dHigh');
if (lo != null && hi != null && lo > hi) throw new Error('Lowest mood can’t be above highest');
if (text('moodNotes')) items.push({ key: 'moodNotes', value: text('moodNotes'), mode: 'new' });
if (!items.length) throw new Error('Set a score or write a note');
break;
}
case 'amMood': case 'aftMood': case 'eveMood': {
const p = id.replace('Mood', '');
if (id in d) items.push({ key: id, value: Number(d[id]), mode: 'new' });
SCORES[p].forEach(([k]) => { if (k in d && d[k] !== '') items.push({ key: k, value: Number(d[k]), mode: 'new' }); });
if (!items.length) throw new Error('Set a score first');
break;
}
case 'bowel':
if (!text(id)) throw new Error('Write something first');
items.push({ key: id, value: text(id), mode: 'new' });
break;
case 'hunger':
if ('hungerScore' in d && d.hungerScore !== '') items.push({ key: 'hungerScore', value: Number(d.hungerScore), mode: 'new' });
if (text('hunger')) items.push({ key: 'hunger', value: text('hunger'), mode: 'new' });
if (!items.length) throw new Error('Set a score or write something');
break;
case 'weight': { const n = num('weight', 30, 200, 'Enter your weight in kg'); if (n == null) throw new Error('Enter your weight'); items.push({ key: 'weight', value: n, mode: 'new' }); break; }
case 'suppsSame': {
const prev = (S.data && S.data.prev) || {};
SUPPS.filter(([k]) => /^y/i.test(prev[k] || '')).forEach(([k]) => items.push({ key: k, value: 'Yes', mode: 'new' }));
['lcarn', 'mag', 'creatine'].forEach(k => { if (numOnly(prev[k]) !== '') items.push({ key: k, value: Number(numOnly(prev[k])), mode: 'new' }); });
if (!items.length) throw new Error('Nothing from yesterday to copy');
break;
}
case 'extraKet': case 'glucose':
if (!text(id)) throw new Error('Write something first');
items.push({ key: id, value: text(id), mode: 'append' });
break;
case 'firstBite': case 'lastBite': {
const t = draft(id, nowHHMM());
if (!/^\d{2}:\d{2}$/.test(t)) throw new Error('Pick a time');
items.push({ key: id, value: t, mode: 'new' });
break;
}
case 'supps': {
const sel = draft('supSel', SUPPS.filter(([k]) => /^y/i.test(v[k] || '')).map(([k]) => k));
sel.forEach(k => items.push({ key: k, value: 'Yes', mode: 'new' }));
const prev = (S.data && S.data.prev) || {};
const lc = num('lcarn', 0, 100000, 'L-carnitine should be a number') ?? (d.lcarn === undefined && (v.lcarn || prev.lcarn) ? Number(v.lcarn || prev.lcarn) : null);
const mg = num('mag', 0, 50, 'Magnesium should be a number') ?? (d.mag === undefined && (v.mag || prev.mag) ? Number(v.mag || prev.mag) : null);
const cr = num('creatine', 0, 50, 'Creatine should be a number of grams') ?? (d.creatine === undefined && (numOnly(v.creatine) || numOnly(prev.creatine)) ? Number(numOnly(v.creatine) || numOnly(prev.creatine)) : null);
if (lc != null && !isNaN(lc)) items.push({ key: 'lcarn', value: lc, mode: 'new' });
if (mg != null && !isNaN(mg)) items.push({ key: 'mag', value: mg, mode: 'new' });
if (cr != null && !isNaN(cr)) items.push({ key: 'creatine', value: cr, mode: 'new' });
if (!items.length) throw new Error('Tick something or enter an amount');
break;
}
case 'exercise': {
const opts = (S.data && S.data.exOptions) || [];
const sel = draft('exSel', []);
if (sel.length) items.push({ key: 'exercise', value: opts.filter(o => sel.indexOf(o) >= 0).join(', '), mode: 'new', sep: ', ' });
GYM.forEach(([k]) => { if (k in d && d[k] !== '') items.push({ key: k, value: Number(d[k]), mode: 'new' }); });
[['gymDur', 'g_dur', 'g_durNote'], ['gymInt', 'g_int', 'g_intNote']].forEach(([k, pk, nk]) => { const t = [d[pk], text(nk)].filter(Boolean).join(', '); if (t) items.push({ key: k, value: t, mode: 'new' }); });
if (text('exNotes')) items.push({ key: 'exNotes', value: text('exNotes'), mode: 'new' });
if (!items.length) throw new Error('Pick an exercise, add a score or write a note');
break;
}
}
return items;
}
// ---------------------------------------------------------------- mood blocks save themselves
const AUTO = {};
function maybeAuto(k) {
const p = ['aft', 'eve', 'am'].find(x => k === x + 'Mood' || SCORES[x].some(([s]) => s === k));
if (!p) return;
const mk = p + 'Mood', v = V();
clearTimeout(AUTO[mk]); delete AUTO[mk];
if (moodDone(v, p) || S.open[mk]) return;
const all = [mk].concat(SCORES[p].map(([s]) => s)).every(x => (x in S.d ? S.d[x] !== '' : filled(v[x])));
if (all) AUTO[mk] = setTimeout(() => { delete AUTO[mk]; autoSave(p); }, 1000);
}
async function autoSave(p) {
const mk = p + 'Mood';
let items; try { items = collect(mk); } catch (e) { return; }
const v = V(), label = S.data ? S.data.label : expectedLabel(S.offset);
const undo = items.filter(it => !filled(v[it.key])).map(it => ({ key: it.key, mode: 'clear', expect: it.value }));
const r = await send(mk, items, label, true);
const name = MOOD_META[p][0];
if (r.status === 'ok') toast(name + ' saved', true, { label: 'Undo', fn: () => undoSave(undo, label) });
else if (r.status === 'queued') toast(name + ' kept on the phone', true, { label: 'Undo', fn: () => { setQ(getQ().filter(j => j.id !== r.id)); render(); toast('Undone', true); } });
}
async function undoSave(undo, label) {
if (!undo.length) return;
try { await api('save', { items: undo, label }); toast('Undone', true); }
catch (e) { toast(e.net ? 'No signal, couldn’t undo. Edit it instead.' : e.message, false); }
load(true);
}
// ---------------------------------------------------------------- events
function bind() {
const app = $('#app');
const prev = $('#prev'), next = $('#next');
if (prev) prev.onclick = () => { S.offset--; S.data = null; S.open = {}; S.d = {}; load(); };
if (next) next.onclick = () => { S.offset++; S.data = null; S.open = {}; S.d = {}; load(); };
const reset = $('#reset');
if (reset) reset.onclick = () => { if (confirmReset()) { localStorage.removeItem(LS_CFG); S.cfg = null; render(); } };
}
function confirmReset() { return window.confirm('Disconnect this phone? You’ll need the setup link again.'); }
document.addEventListener('input', e => {
const el = e.target;
if (el.dataset.d) { S.d[el.dataset.d] = el.value; return; }
if (el.dataset.range) {
const k = el.dataset.range; S.d[k] = el.value;
const min = +el.min, max = +el.max, val = +el.value, pct = x => ((x - min) / (max - min) * 100) + '%';
el.classList.remove('untouched');
if (min < 0) { el.style.setProperty('--lo', pct(Math.min(0, val))); el.style.setProperty('--hi', pct(Math.max(0, val))); }
else el.style.setProperty('--fill-a', pct(val));
const big = document.querySelector('[data-for="' + k + '"]') || el.closest('.card').querySelector('.big');
if (big) { big.classList.remove('empty'); big.textContent = min < 0 ? signed(val) : val; }
maybeAuto(k);
}
});
document.addEventListener('click', e => {
const b = e.target.closest('button');
if (!b) {
const sum = e.target.closest('summary');
if (sum) { const det = sum.parentElement; setTimeout(() => { if (det.id === 'gym-d') S.open.gym = det.open; if (det.id === 'supp-d') S.open.suppsBody = det.open; }, 0); }
return;
}
const ds = b.dataset;
if (ds.score) {
// tap n -> n, tap again -> n.5, tap again -> clear
const k = ds.score, i = Number(ds.v), cur = ds.cur === '' ? null : Number(ds.cur);
if (cur === i && i < 10) S.d[k] = String(i + 0.5);
else if (cur === i || cur === i + 0.5) delete S.d[k];
else S.d[k] = String(i);
if (navigator.vibrate) navigator.vibrate(8);
maybeAuto(k); render(); return;
}
if (ds.suppedit) { S.open.suppEdit = true; render(); return; }
if (ds.flush) { flush(true); return; }
if (ds.update) { (window.caches ? caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))) : Promise.resolve()).then(() => location.reload()); return; }
if (ds.tab) { S.tab = ds.tab; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
if (ds.edit) { S.open[ds.edit] = true; render(); return; }
if (ds.close) { S.open[ds.close] = false; (CLEAR[ds.close] || [ds.close]).forEach(k => delete S.d[k]); render(); return; }
if (ds.nudge) {
const k = ds.nudge, min = +ds.min, max = +ds.max;
const r = document.getElementById('r_' + k);
const cur = k in S.d ? Number(S.d[k]) : Number(r.value);
S.d[k] = String(Math.min(max, Math.max(min, cur + Number(ds.step))));
maybeAuto(k); render(); return;
}
if (ds.chip) {
const sel = draft('exSel', []).slice(), i = sel.indexOf(ds.chip);
if (i >= 0) sel.splice(i, 1); else sel.push(ds.chip);
S.d.exSel = sel; render(); return;
}
if (ds.segv) {
const k = b.parentElement.dataset.segkey;
if (k) { S.d[k] = S.d[k] === ds.segv ? '' : ds.segv; render(); }
return;
}
if (ds.supp) {
const v = V();
const sel = draft('supSel', SUPPS.filter(([k]) => /^y/i.test(v[k] || '')).map(([k]) => k)).slice(), i = sel.indexOf(ds.supp);
if (i >= 0) sel.splice(i, 1); else sel.push(ds.supp);
S.d.supSel = sel; render(); return;
}
if (ds.save) {
let items;
try { items = collect(ds.save); } catch (err) { toast(err.message, false); return; }
send(ds.save, items);
}
});
document.addEventListener('visibilitychange', () => {
if (document.hidden || !S.cfg) return;
const want = expectedLabel(S.offset);
if (S.offset === 0 && S.data && S.data.label !== want) { S.data = null; S.open = {}; S.d = {}; S.tab = defaultTab(); }
if (getQ().length) flush(); else load(true);
checkUpdate();
});
async function checkUpdate() {
try { const j = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()); if (String(j.v) !== APP_VERSION && !S.update) { S.update = true; render(); } } catch (e) {}
}
window.addEventListener('online', () => flush());
window.addEventListener('hashchange', () => { takeSetupFromLink(); S.cfg = readCfg(); if (S.cfg) { S.data = null; load(); } });
// ---------------------------------------------------------------- start
takeSetupFromLink();
S.cfg = readCfg();
const qTab = new URLSearchParams(location.search).get('tab');
S.tab = TABS.indexOf(qTab) >= 0 ? qTab : defaultTab();
if (S.cfg) { load().then(() => flush()); } else render();
checkUpdate();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
